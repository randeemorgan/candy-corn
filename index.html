<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Corn Counting: Make-Up Activity</title>
<style>
:root{--grape:#2a1250;--panel:#3d1f6b;--tray:#4b2a80;--line:#7a55b3;--cream:#fff8e8;--orange:#ff9a1f;--yellow:#ffd23f;--leaf:#8bdc6e;--ink:#1d0f33;--soft:#e6d9fb}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--grape);color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:20px;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:clamp(2rem,7vw,3rem);margin:12px 0 6px;line-height:1.1}
h2{font-size:clamp(1.4rem,5vw,2rem);margin:8px 0 12px;text-align:center}
p{margin:6px 0}
.center{text-align:center}
.btn{border:0;border-radius:999px;background:var(--orange);color:var(--ink);font:inherit;font-weight:700;font-size:1.2rem;padding:12px 28px;min-height:54px;cursor:pointer;box-shadow:0 5px 0 #b86a00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b86a00}
.btn.ghost{background:transparent;color:#fff;border:3px solid var(--line);box-shadow:none}
.btn:focus-visible,.ans:focus-visible,.candy:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #fff;outline-offset:3px}
input[type=text]{font:inherit;font-size:1.3rem;padding:12px 16px;border-radius:14px;border:3px solid var(--line);width:100%;max-width:360px;background:#fff;color:var(--ink)}
.steps{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.steps li{background:var(--panel);border-radius:18px;padding:12px 16px}
.steps b{color:var(--yellow)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
.dot.now{background:var(--yellow);border-color:var(--yellow)}
.dot.done{background:var(--leaf);border-color:var(--leaf)}
#stage{position:relative;background:var(--tray);border:3px solid var(--line);border-radius:26px;padding:12px;min-height:200px}
.line,.array{display:flex;flex-wrap:wrap;gap:10px 8px;justify-content:center;align-items:center;min-height:180px}
.array{max-width:430px;margin:0 auto}
.scatter{position:relative;height:270px}
.scatter .candy{position:absolute}
.candy{position:relative;width:54px;height:70px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.candy svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.candy .badge{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);min-width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);border:3px solid var(--ink);font-weight:700;font-size:17px;display:none;align-items:center;justify-content:center;line-height:1}
.candy.on .badge{display:flex}
.candy.on svg{opacity:.85}
#msg{min-height:2.4em;text-align:center;font-weight:700;margin:12px 0 4px;font-size:1.25rem}
.answers{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}
.ans{min-width:96px;height:84px;border-radius:22px;border:0;background:var(--yellow);color:var(--ink);font:inherit;font-size:2.6rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 #b98700}
.ans:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #b98700}
.ans.right{background:var(--leaf);box-shadow:0 6px 0 #4c9a35}
.ans.miss{opacity:.35;box-shadow:none}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.card{background:var(--cream);color:var(--ink);border-radius:22px;padding:16px 18px;margin:14px 0}
.card h3{margin:0 0 6px;font-size:1.2rem}
.card pre{white-space:pre-wrap;font:inherit;font-size:1rem;margin:0}
textarea{width:100%;min-height:150px;font:inherit;font-size:.95rem;padding:10px;border-radius:12px;border:2px solid #b9a6d8;background:#fff;color:var(--ink)}
.note{color:var(--soft);font-size:.95rem}
.pair{display:flex;flex-wrap:wrap;gap:12px 14px;justify-content:center;align-items:center;min-height:180px}
.grp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:250px}
.plus{font-size:2.6rem;font-weight:700;color:var(--yellow)}
.candy.gone svg{opacity:.18;filter:grayscale(1)}
.candy.gone::after{content:"\2715";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.4rem;color:#fff;font-weight:700}
@media (prefers-reduced-motion:no-preference){.candy.wob svg{animation:wob .35s}}
@keyframes wob{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
</style>
</head>
